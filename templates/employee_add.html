<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js"></script>
    <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
</head>
<body>
    <div class="container" style="margin-top:30px; max-width:500px;">

        <h1>Add New Employee</h1>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" class="form-control" name="emp_id" placeholder="e.g. E101" required>
            </div>

            <div class="form-group">
                <label>Employee Name</label>
                <input type="text" class="form-control" name="emp_name" placeholder="e.g. Arun Kumar" required>
            </div>

            <div class="form-group">
                <label>Designation</label>
                <input type="text" class="form-control" name="designation" placeholder="e.g. Barista" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select class="form-control" name="gender" required>
                    <option value="">-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" class="form-control" name="mob_no" placeholder="e.g. 9876543210" required>
            </div>

            <button type="submit" class="btn btn-success">Add Employee</button>
            <a href="{{ url_for('employees') }}" class="btn btn-default">Cancel</a>

        </form>

    </div>
</body>
</html>
