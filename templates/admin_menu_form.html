<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if mode == 'edit' %}Edit{% else %}Add{% endif %} Menu Item</title>
    <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js"></script>
    <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
</head>
<body>
    <div class="container" style="margin-top:30px; max-width:500px;">

        <h1>{% if mode == 'edit' %}Edit Menu Item{% else %}Add New Menu Item{% endif %}</h1>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">

            {% if mode == 'add' %}
            <div class="form-group">
                <label>Item ID (unique, e.g. item24)</label>
                <input type="text" class="form-control" name="item_id" placeholder="item24" required>
            </div>
            {% else %}
            <div class="form-group">
                <label>Item ID</label>
                <input type="text" class="form-control" value="{{ item.ITEM_ID }}" disabled>
            </div>
            {% endif %}

            <div class="form-group">
                <label>Item Name</label>
                <input type="text" class="form-control" name="name" placeholder="e.g. Oreo Shake"
                       value="{% if item %}{{ item.ITEM_NAME }}{% endif %}" required>
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" class="form-control" name="price" placeholder="e.g. 150"
                       value="{% if item %}{{ item.PRICE }}{% endif %}" required>
            </div>

            <div class="form-group">
                <label>Description (shown to customers)</label>
                <textarea class="form-control" name="description" rows="3" placeholder="e.g. Rich chocolate shake topped with whipped cream.">{% if item %}{{ item.DESCRIPTION }}{% endif %}</textarea>
            </div>

            <div class="form-group">
                <label>Image filename (optional, must already exist in static/images folder)</label>
                <input type="text" class="form-control" name="image_url" placeholder="e.g. OreoShake.jpg"
                       value="{% if item %}{{ item.IMAGE_URL }}{% endif %}">
                <small class="text-muted">Leave blank to show a placeholder image. Upload your image file into <code>static/images/</code> first, then type its exact filename here.</small>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select class="form-control" name="category" required>
                    {% set current_category = item.CATEGORY if item else '' %}
                    <option value="Coffee" {% if current_category == 'Coffee' %}selected{% endif %}>Coffee</option>
                    <option value="Pizza" {% if current_category == 'Pizza' %}selected{% endif %}>Pizza</option>
                    <option value="Burgers" {% if current_category == 'Burgers' %}selected{% endif %}>Burgers</option>
                    <option value="Sandwiches" {% if current_category == 'Sandwiches' %}selected{% endif %}>Sandwiches</option>
                    <option value="ShortEats" {% if current_category == 'ShortEats' %}selected{% endif %}>ShortEats / Wraps</option>
                    <option value="Beverages" {% if current_category == 'Beverages' %}selected{% endif %}>Beverages</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">{% if mode == 'edit' %}Save Changes{% else %}Add Item{% endif %}</button>
            <a href="{{ url_for('admin_menu') }}" class="btn btn-default">Cancel</a>

        </form>

    </div>
</body>
</html>
